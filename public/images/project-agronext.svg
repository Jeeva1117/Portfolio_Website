<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" style="background:#050505">
  <defs>
    <radialGradient id="agroGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#04321b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#021a0d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="limeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glowFiltAgro" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#agroGlow)"/>

  <!-- Subtle Perspective Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="1000"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="700" y1="0" x2="700" y2="1000"/>
    <line x1="900" y1="0" x2="900" y2="1000"/>
    <line x1="1100" y1="0" x2="1100" y2="1000"/>
    <line x1="1300" y1="0" x2="1300" y2="1000"/>
    <line x1="1500" y1="0" x2="1500" y2="1000"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
  </g>

  <!-- Left / Center: 3D Plant Leaf Scanner Viewport -->
  <g transform="translate(140, 140)">
    <!-- Container frame -->
    <rect width="840" height="700" rx="20" fill="#090d0b" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.12"/>
    
    <!-- Header -->
    <g transform="translate(36, 32)">
      <circle cx="12" cy="12" r="10" fill="#CCFF00" fill-opacity="0.2"/>
      <circle cx="12" cy="12" r="4" fill="#CCFF00"/>
      <text x="32" y="17" fill="#ffffff" font-family="'Space Grotesk', Inter, sans-serif" font-size="15" font-weight="900" letter-spacing="1">AGRONEXT</text>
      <text x="130" y="17" fill="#CCFF00" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">// COMPUTER VISION PLANT SCANNER</text>
      
      <rect x="660" y="0" width="110" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="715" y="16" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="10" font-weight="700">CNN DETECTING</text>
    </g>
    <line x1="36" y1="68" x2="804" y2="68" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Central Leaf & Computer Vision HUD -->
    <g transform="translate(120, 110)">
      <!-- Botanical Leaf Illustration with vein structures -->
      <path d="M 300 480 C 120 400, 40 220, 160 80 C 260 20, 460 60, 480 260 C 500 400, 360 460, 300 480 Z" fill="url(#leafGrad)" stroke="#CCFF00" stroke-opacity="0.4" stroke-width="2"/>
      
      <!-- Main stem vein -->
      <path d="M 160 80 Q 280 240 300 480" fill="none" stroke="#CCFF00" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Lateral veins -->
      <path d="M 210 160 Q 150 180 100 210" fill="none" stroke="#CCFF00" stroke-opacity="0.5" stroke-width="1.5"/>
      <path d="M 245 230 Q 380 200 440 220" fill="none" stroke="#CCFF00" stroke-opacity="0.5" stroke-width="1.5"/>
      <path d="M 270 310 Q 180 330 130 360" fill="none" stroke="#CCFF00" stroke-opacity="0.5" stroke-width="1.5"/>
      <path d="M 285 380 Q 360 370 410 390" fill="none" stroke="#CCFF00" stroke-opacity="0.5" stroke-width="1.5"/>

      <!-- Scanning Grid Laser Line across leaf -->
      <line x1="40" y1="260" x2="520" y2="260" stroke="#CCFF00" stroke-width="2.5" filter="url(#glowFiltAgro)"/>
      
      <!-- Bounding Box 1: Early Blight Infection Zone -->
      <g transform="translate(110, 180)">
        <rect width="130" height="90" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" filter="url(#glowFiltAgro)"/>
        <!-- Corner brackets -->
        <path d="M 0 12 L 0 0 L 12 0" fill="none" stroke="#ef4444" stroke-width="3"/>
        <path d="M 118 0 L 130 0 L 130 12" fill="none" stroke="#ef4444" stroke-width="3"/>
        <path d="M 0 78 L 0 90 L 12 90" fill="none" stroke="#ef4444" stroke-width="3"/>
        <path d="M 118 90 L 130 90 L 130 78" fill="none" stroke="#ef4444" stroke-width="3"/>

        <!-- Tag label -->
        <rect x="0" y="-22" width="120" height="20" rx="4" fill="#ef4444"/>
        <text x="60" y="-8" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700">EARLY BLIGHT [98.7%]</text>

        <!-- Lesion spots on leaf -->
        <ellipse cx="65" cy="45" rx="20" ry="14" fill="#78350f" opacity="0.8"/>
        <ellipse cx="75" cy="50" rx="10" ry="6" fill="#451a03"/>
      </g>

      <!-- Bounding Box 2: Healthy Foliage Zone -->
      <g transform="translate(320, 130)">
        <rect width="120" height="80" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.5"/>
        <rect x="0" y="-20" width="95" height="18" rx="4" fill="#10b981"/>
        <text x="47" y="-7" text-anchor="middle" fill="#000000" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700">HEALTHY [99.2%]</text>
      </g>
    </g>

    <!-- Bottom Telemetry Bar -->
    <g transform="translate(36, 610)">
      <rect width="768" height="58" rx="10" fill="#111714" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="24" y="26" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">CNN MODEL: <tspan fill="#ffffff" font-weight="bold">EfficientNet-B4</tspan></text>
      <text x="24" y="44" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">INFERENCE LATENCY: <tspan fill="#CCFF00" font-weight="bold">42ms</tspan></text>

      <text x="320" y="26" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">CLASSIFICATION: <tspan fill="#ef4444" font-weight="bold">Alternaria solani</tspan></text>
      <text x="320" y="44" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">SEVERITY: <tspan fill="#f59e0b" font-weight="bold">Stage 1 (Incipient)</tspan></text>

      <rect x="620" y="12" width="126" height="34" rx="6" fill="#CCFF00" fill-opacity="0.12" stroke="#CCFF00" stroke-opacity="0.3"/>
      <text x="683" y="33" text-anchor="middle" fill="#CCFF00" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">ACTION READY</text>
    </g>
  </g>

  <!-- Right Side: Agricultural Voice Assistant & Treatment Engine -->
  <g transform="translate(1020, 140)">
    <rect width="440" height="700" rx="20" fill="#090d0b" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.12"/>
    
    <!-- Title -->
    <text x="32" y="48" fill="#CCFF00" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">VOICE AI ASSISTANT // REALTIME</text>
    <line x1="32" y1="68" x2="408" y2="68" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Voice Visualizer Waveform -->
    <g transform="translate(32, 90)">
      <rect width="376" height="110" rx="12" fill="#111714" stroke="#ffffff" stroke-opacity="0.06"/>
      
      <!-- Microphone icon and state -->
      <circle cx="36" cy="36" r="16" fill="#CCFF00" fill-opacity="0.15"/>
      <path d="M 33 28 L 39 28 L 39 36 A 3 3 0 0 1 33 36 Z" fill="#CCFF00"/>
      <path d="M 30 34 A 6 6 0 0 0 42 34" fill="none" stroke="#CCFF00" stroke-width="2"/>
      <line x1="36" y1="40" x2="36" y2="46" stroke="#CCFF00" stroke-width="2"/>

      <text x="64" y="34" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">Farmer Voice Query Captured</text>
      <text x="64" y="48" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">Speech-to-Text: Whisper Multilingual Model</text>

      <!-- Audio Frequency Bars -->
      <g transform="translate(32, 65)">
        <rect x="0" y="10" width="5" height="25" rx="2" fill="#CCFF00"/>
        <rect x="10" y="4" width="5" height="31" rx="2" fill="#CCFF00"/>
        <rect x="20" y="16" width="5" height="19" rx="2" fill="#CCFF00"/>
        <rect x="30" y="2" width="5" height="33" rx="2" fill="#CCFF00"/>
        <rect x="40" y="12" width="5" height="23" rx="2" fill="#10b981"/>
        <rect x="50" y="20" width="5" height="15" rx="2" fill="#10b981"/>
        <rect x="60" y="8" width="5" height="27" rx="2" fill="#CCFF00"/>
        <rect x="70" y="0" width="5" height="35" rx="2" fill="#CCFF00"/>
        <rect x="80" y="14" width="5" height="21" rx="2" fill="#10b981"/>
        <rect x="90" y="22" width="5" height="13" rx="2" fill="#10b981"/>
        <rect x="100" y="6" width="5" height="29" rx="2" fill="#CCFF00"/>
        <rect x="110" y="12" width="5" height="23" rx="2" fill="#CCFF00"/>
        <rect x="120" y="2" width="5" height="33" rx="2" fill="#CCFF00"/>
        <rect x="130" y="18" width="5" height="17" rx="2" fill="#10b981"/>
        <rect x="140" y="8" width="5" height="27" rx="2" fill="#CCFF00"/>
        <rect x="150" y="14" width="5" height="21" rx="2" fill="#CCFF00"/>
        <rect x="160" y="4" width="5" height="31" rx="2" fill="#CCFF00"/>
        <rect x="170" y="20" width="5" height="15" rx="2" fill="#10b981"/>
        <rect x="180" y="10" width="5" height="25" rx="2" fill="#CCFF00"/>
        <rect x="190" y="6" width="5" height="29" rx="2" fill="#CCFF00"/>
        <rect x="200" y="16" width="5" height="19" rx="2" fill="#10b981"/>
        <rect x="210" y="0" width="5" height="35" rx="2" fill="#CCFF00"/>
        <rect x="220" y="12" width="5" height="23" rx="2" fill="#CCFF00"/>
        <rect x="230" y="20" width="5" height="15" rx="2" fill="#10b981"/>
        <rect x="240" y="8" width="5" height="27" rx="2" fill="#CCFF00"/>
        <rect x="250" y="14" width="5" height="21" rx="2" fill="#CCFF00"/>
        <rect x="260" y="4" width="5" height="31" rx="2" fill="#CCFF00"/>
        <rect x="270" y="18" width="5" height="17" rx="2" fill="#10b981"/>
        <rect x="280" y="10" width="5" height="25" rx="2" fill="#CCFF00"/>
        <rect x="290" y="14" width="5" height="21" rx="2" fill="#CCFF00"/>
        <rect x="300" y="8" width="5" height="27" rx="2" fill="#CCFF00"/>
      </g>
    </g>

    <!-- Transcribed Conversation Card -->
    <g transform="translate(32, 220)">
      <rect width="376" height="74" rx="10" fill="#141a16" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="16" y="24" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">TRANSCRIBED AUDIO:</text>
      <text x="16" y="46" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">"What is this brown spot on my tomato crop and how do I cure it?"</text>
    </g>

    <!-- AI Prescription & Treatment Plan -->
    <g transform="translate(32, 314)">
      <rect width="376" height="260" rx="12" fill="#111714" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="18" y="18" width="130" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="83" y="33" text-anchor="middle" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">TREATMENT PROTOCOL</text>
      
      <text x="18" y="66" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">Recommended Remediation Steps:</text>
      
      <g transform="translate(18, 86)">
        <circle cx="6" cy="6" r="3" fill="#CCFF00"/>
        <text x="18" y="10" fill="#D1D5DB" font-family="Inter, sans-serif" font-size="11">1. Prune lower diseased foliage immediately.</text>

        <circle cx="6" cy="34" r="3" fill="#CCFF00"/>
        <text x="18" y="38" fill="#D1D5DB" font-family="Inter, sans-serif" font-size="11">2. Apply bio-fungicide (Copper Octanoate or Bacillus).</text>

        <circle cx="6" cy="62" r="3" fill="#CCFF00"/>
        <text x="18" y="66" fill="#D1D5DB" font-family="Inter, sans-serif" font-size="11">3. Optimize drip irrigation; avoid overhead canopy wetness.</text>

        <circle cx="6" cy="90" r="3" fill="#CCFF00"/>
        <text x="18" y="94" fill="#D1D5DB" font-family="Inter, sans-serif" font-size="11">4. Schedule follow-up scan in 5 days via AgroNext mobile app.</text>
      </g>

      <line x1="18" y1="214" x2="358" y2="214" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="18" y="238" fill="#10b981" font-family="monospace" font-size="11">> TTS Speech synthesized in Tamil &amp; English</text>
    </g>

    <!-- Bottom Audio Trigger Button -->
    <g transform="translate(32, 594)">
      <rect width="376" height="52" rx="8" fill="#CCFF00" fill-opacity="0.12" stroke="#CCFF00" stroke-opacity="0.3"/>
      <text x="188" y="32" text-anchor="middle" fill="#CCFF00" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">SPEECH SYNTHESIS ENGINE: ACTIVE</text>
    </g>
  </g>
</svg>

